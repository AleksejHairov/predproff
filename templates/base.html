<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Школьная столовая</title>
    <style>
        :root {
            --primary: #2563eb;
            --primary-dark: #1e40af;
            --success: #16a34a;
            --danger: #dc2626;
            --warning: #d97706;
            --bg: #f1f5f9;
            --card: #ffffff;
            --text: #0f172a;
            --muted: #475569;
            --border: #dbeafe;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: "Segoe UI", system-ui, sans-serif;
            background: linear-gradient(130deg, #dbeafe, #f8fafc);
            color: var(--text);
        }

        .container {
            max-width: 1100px;
            margin: 32px auto;
            padding: 16px;
        }

        .nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 18px;
            background: var(--card);
            border-radius: 14px;
            padding: 14px 16px;
            box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
        }

        .nav .title {
            font-weight: 700;
        }

        .nav-links {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        .card {
            background: var(--card);
            border-radius: 14px;
            padding: 18px;
            margin-bottom: 16px;
            box-shadow: 0 10px 28px rgba(15, 23, 42, 0.08);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
            gap: 12px;
        }

        h1, h2, h3 {
            margin: 0 0 10px 0;
        }

        label {
            display: block;
            font-weight: 600;
            color: var(--muted);
            margin-bottom: 6px;
        }

        input, select, textarea, button {
            width: 100%;
            border-radius: 10px;
            padding: 10px 12px;
            border: 1px solid var(--border);
            margin-bottom: 10px;
            font-size: 14px;
        }

        textarea {
            min-height: 88px;
            resize: vertical;
        }

        button {
            border: none;
            background: var(--primary);
            color: #fff;
            font-weight: 600;
            cursor: pointer;
            margin-bottom: 0;
        }

        button:hover {
            background: var(--primary-dark);
        }

        .btn-muted {
            background: #334155;
        }

        .btn-danger {
            background: var(--danger);
        }

        .btn-success {
            background: var(--success);
        }

        .btn-warning {
            background: var(--warning);
        }

        .inline {
            display: inline-block;
            width: auto;
            margin: 0;
        }

        a {
            color: var(--primary);
            text-decoration: none;
            font-weight: 600;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 14px;
        }

        th, td {
            text-align: left;
            border-bottom: 1px solid #e2e8f0;
            padding: 8px 6px;
            vertical-align: top;
        }

        .badge {
            display: inline-block;
            background: #dbeafe;
            color: #1e3a8a;
            border-radius: 999px;
            padding: 4px 10px;
            font-size: 12px;
            font-weight: 700;
            margin-right: 8px;
        }

        .notice {
            border-left: 4px solid #60a5fa;
            background: #f8fafc;
            padding: 8px 10px;
            margin-bottom: 8px;
            border-radius: 8px;
            font-size: 14px;
        }

        .text-muted {
            color: var(--muted);
        }

        .text-danger {
            color: var(--danger);
            font-weight: 600;
        }

        .text-success {
            color: var(--success);
            font-weight: 600;
        }

        .split {
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        @media (max-width: 700px) {
            .nav {
                flex-direction: column;
                align-items: flex-start;
            }

            .nav-links {
                width: 100%;
            }

            .nav-links a, .nav-links form {
                width: 100%;
            }

            .nav-links button {
                width: 100%;
            }
        }
    </style>
</head>
<body>

<div class="container">
    <div class="nav">
        <div class="title">🍽 Школьная столовая</div>
        <div class="nav-links">
            {% if session.get("user_id") %}
                <a href="/dashboard">Кабинет</a>
                <form method="post" action="/notifications/seen" class="inline">
                    <button class="btn-muted inline" type="submit">Прочитать уведомления</button>
                </form>
                <a href="/logout">Выйти</a>
            {% else %}
                <a href="/">Вход</a>
                <a href="/register">Регистрация</a>
            {% endif %}
        </div>
    </div>

    {% block content %}{% endblock %}
</div>

</body>
</html>
